name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Validate specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint spec/openapi.yaml

      - name: Compile JSON Schemas
        run: |
          npx --yes ajv-cli@5 compile -s spec/agent-manifest.schema.json --spec=draft2020
          npx --yes ajv-cli@5 compile -s spec/events.schema.json --spec=draft2020

      - name: Example manifest validates
        run: |
          npx --yes ajv-cli@5 validate \
            -s spec/agent-manifest.schema.json \
            -d examples/agent.manifest.json \
            --spec=draft2020

  docs:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Link check
        run: npx --yes markdown-link-check@3 --quiet README.md README.ru.md docs/*.md

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
      - name: Syntax check
        run: find sdk/php/src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
        working-directory: sdk/php
